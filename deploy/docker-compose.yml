# M7 reference deployment. One command: docker compose up. TLS via caddy. Not runnable until M7.
services:
  verify:
    build: ../packages/verify-service
    environment:
      - DEMO_LEVEL=2
      - TRUST_ROOT_URL=https://root.greenlight.example/root.txt
    expose: ["8080"]
  caddy:
    image: caddy:2
    ports: ["443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "../packages/desk-screen:/srv/desk", "../packages/prover-page/dist:/srv/prove"]
