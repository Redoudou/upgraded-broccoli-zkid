# Why this workflow exists (SIMPLICITY.md): the prover artifacts in packages/circuits/artifacts are committed
# so the demo needs Node only. This job rebuilds them from the pinned longfellow-zk commit on a machine we
# do not own and reports whether the wasm still matches the committed hash (a reproducibility check).
name: longfellow-wasm
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Rebuild wasm and native helper from the pin
        run: |
          set -euo pipefail
          cp packages/circuits/artifacts/SHA256SUMS /tmp/committed.sums
          ./packages/circuits/build.sh
          echo "== committed"; cat /tmp/committed.sums; echo "== rebuilt"; cat packages/circuits/artifacts/SHA256SUMS
          if diff -q /tmp/committed.sums packages/circuits/artifacts/SHA256SUMS; then echo "::notice::longfellow.wasm rebuild is byte-identical to the committed artifact"
          else echo "::warning::rebuilt artifacts differ from the committed ones (toolchain drift or pin change); see the log"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: longfellow-artifacts-${{ github.run_number }}
          path: packages/circuits/artifacts/
