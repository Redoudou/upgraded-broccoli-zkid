name: pages
# Publishes site/ (the static walkthrough) to GitHub Pages. No build step: the page is one
# self-contained HTML file. Enable once in Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write       # deploy to Pages
  id-token: write    # Pages deployment token
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v5
