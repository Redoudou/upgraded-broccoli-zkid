<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:">
<title>Green Light — desk</title>
<style>body{font:20px system-ui;margin:2rem;text-align:center}#state{font-size:3rem;padding:2rem;border-radius:1rem}.wait{background:#eee}.green{background:#2ecc71;color:#fff}.red{background:#e74c3c;color:#fff}</style>
<p id="level"></p>
<div id="qr"></div>
<div id="state" class="wait">Waiting</div>
<script>
// Level 1: long-poll /result until websocket lands in M2 (test A8).
async function session() {
  const s = await (await fetch('/session', { method: 'POST' })).json();
  document.getElementById('level').textContent = `Level ${s.demo_level}`;
  document.getElementById('qr').textContent = s.url; // M2: render a real QR from s.url
  const st = document.getElementById('state'); st.className = 'wait'; st.textContent = 'Waiting';
  const until = s.expires_at;
  while (Date.now() < until) {
    const r = await (await fetch(`/result/${s.nonce}`)).json();
    if (r.result !== 'waiting') { st.className = r.result; st.textContent = r.result === 'green' ? 'OK' : `No (${r.reason})`; await new Promise(r => setTimeout(r, 3000)); break; }
    await new Promise(r => setTimeout(r, 500));
  }
  session();
}
session();
</script>
